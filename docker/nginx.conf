# =============================================================================
# nginx.conf — SPA routing for modular-frontend-architecture
#
# Serves the merged production build:
#   /                       → shell SPA (index.html fallback)
#   /ui-components/mf/*     → Module Federation remote chunks
#   /static/*               → shell static assets
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers ──────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Gzip compression ─────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ─── Module Federation assets ──────────────────────────────────────
    # MF chunks are content-hashed in production — aggressive cache
    location /ui-components/mf/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ─── Static assets (JS, CSS, images) ──────────────────────────────
    # Content-hashed by Rsbuild — aggressive cache
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ─── SPA fallback ─────────────────────────────────────────────────
    # All non-file routes fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;

        # HTML should never be cached aggressively
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ─── Health check endpoint ────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ─── Deny dotfiles ────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
