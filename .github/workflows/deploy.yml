name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ui-components
        run: bun nx run ui-components:build --env-mode production

      - name: Create shell .env.production
        run: echo "PUBLIC_BUCKET_URL=https://modular-frontend.pages.dev" > .env.production

      - name: Build shell
        run: bun nx run shell:build:prod

      - name: Copy MF remote into shell dist
        run: |
          mkdir -p packages/shell/dist/ui-components/mf
          cp -r packages/libraries/ui-components/dist/ui-components/mf/* packages/shell/dist/ui-components/mf/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/shell/dist --project-name=modular-frontend --branch=${{ github.head_ref || github.ref_name }}
