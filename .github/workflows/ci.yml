name: CI — Unit Tests & Coverage

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        run: bun run test

      - name: Upload ui-components coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui-components
          path: packages/libraries/ui-components/coverage/
          retention-days: 30

      - name: Upload shell coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shell
          path: packages/shell/coverage/
          retention-days: 30

      - name: Merge coverage reports
        if: always()
        run: |
          mkdir -p coverage-report/ui-components
          mkdir -p coverage-report/shell

          # Copy HTML reports
          cp -r packages/libraries/ui-components/coverage/* coverage-report/ui-components/ 2>/dev/null || true
          cp -r packages/shell/coverage/* coverage-report/shell/ 2>/dev/null || true

          # Create index page
          cat > coverage-report/index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Coverage Reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 600px; margin: 4rem auto; padding: 0 1rem; }
              a { display: block; padding: 1rem; margin: 0.5rem 0; background: #f0f0f0; border-radius: 8px; text-decoration: none; color: #333; }
              a:hover { background: #e0e0e0; }
              h1 { color: #1a1a1a; }
            </style>
          </head>
          <body>
            <h1>Coverage Reports</h1>
            <a href="./ui-components/index.html">ui-components</a>
            <a href="./shell/index.html">shell</a>
          </body>
          </html>
          INDEXEOF

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

      - name: Deploy coverage to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage-report
          destination_dir: coverage
          keep_files: true
