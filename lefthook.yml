pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{js,ts,jsx,tsx}"
      run: bunx biome check --write {staged_files} && git add {staged_files}

    - name: format
      glob: "*.{js,ts,jsx,tsx,json,css}"
      run: bunx biome format --write {staged_files} && git add {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
